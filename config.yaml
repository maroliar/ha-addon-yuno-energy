name: "Yuno Energy"
version: "0.1.0"
slug: "yuno_energy"
description: "Track your Yuno Energy bill forecast, usage, and vampire energy"
url: "https://github.com/maroliar/ha-addon-yuno-energy"
arch:
  - amd64
  - aarch64
init: false

options:
  yuno_email: ""
  yuno_password: ""
  yuno_app_credential: ""   # see EXTRACTING_CREDENTIAL.md - not shipped with this addon
  update_interval_minutes: 1440   # once a day, matching Yuno's own smart meter update cadence
  mqtt:
    host: "core-mosquitto"
    port: 1883
    user: ""
    pass: ""

schema:
  yuno_email: "str"
  yuno_password: "password"
  yuno_app_credential: "password"
  update_interval_minutes: "int(60,10080)"
  mqtt:
    host: "str"
    port: "port"
    user: "str"
    pass: "password"
